server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # SPA routing: unknown paths fall through to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API proxy. Keeps `sentry-trace` / `baggage` headers on a
    # same-origin request, so no CORS preflight can strip them.
    location /api/ {
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /api/chaos/slow?seconds=30 must not be killed by the proxy first.
        proxy_read_timeout 120s;
    }
}
